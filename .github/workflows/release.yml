name: Release Addon

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ADDON_NAME: KeybindProfiles

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute archive name
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="manual-${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=${ADDON_NAME}-${version}.zip" >> "${GITHUB_OUTPUT}"

      - name: Stage addon files
        shell: bash
        run: |
          mkdir -p "dist/${ADDON_NAME}"
          rsync -av \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude '.DS_Store' \
            ./ "dist/${ADDON_NAME}/"

      - name: Build release zip
        shell: bash
        run: |
          cd dist
          zip -r "${{ steps.meta.outputs.archive }}" "${ADDON_NAME}"

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: dist/${{ steps.meta.outputs.archive }}
          generate_release_notes: true

      - name: Upload manual build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.archive }}
          path: dist/${{ steps.meta.outputs.archive }}
